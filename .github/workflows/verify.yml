name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    name: framework integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Framework verify
        run: bash scripts/framework-verify.sh

      - name: Self-test — the verifiers still catch what they claim to
        run: bash scripts/self-test.sh

      - name: Shell syntax
        run: |
          fail=0
          for f in scripts/*.sh hooks/* templates/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh hooks/* templates/*.sh || true

  evals:
    name: eval scorers + adopter CI template (real Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      # Every scenario: seed must fail its held-out acceptance test, the
      # reference solution must pass every check (analyze, format, tests,
      # acceptance), and every bad solution must fail the check it names.
      - name: Eval selftest with toolchain
        run: bash evals/run.sh selftest

      # The adopter template is the thing under test, executed step by step
      # against the eval base app. A template that cannot pass on a clean app
      # would fail every adopter on day one.
      - name: Adopter CI template on the base app
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash evals/run.sh materialize base "$RUNNER_TEMP/base-app"
          FLUTTER_AGENT_OS_SOURCE="$GITHUB_WORKSPACE" python3 evals/tools/run-workflow-steps.py \
            templates/ci/github-actions/flutter-gates.yml --job gate --cwd "$RUNNER_TEMP/base-app" \
            --var COVERAGE_FLOOR=50 --var COVERAGE_SCOPE=lib/

  desktop:
    name: adopter desktop job on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, job: desktop-linux }
          - { runner: macos-latest, platform: macos, job: desktop-macos }
          - { runner: windows-latest, platform: windows, job: desktop-windows }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Real desktop build of the eval base app on the real OS, through the
      # template job adopters copy — the only proof the desktop jobs work.
      - name: Base app with the ${{ matrix.platform }} platform folder
        run: |
          bash evals/run.sh materialize base ../desktop-app
          cd ../desktop-app
          flutter create --platforms=${{ matrix.platform }} --project-name eval_app .

      - name: Adopter template job ${{ matrix.job }}, step by step
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -c 'import yaml' 2>/dev/null || "$PY" -m pip install --quiet pyyaml
          "$PY" evals/tools/run-workflow-steps.py templates/ci/github-actions/flutter-gates.yml \
            --job ${{ matrix.job }} --cwd ../desktop-app

  devcontainer:
    name: dev container template builds and runs Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the adopter dev container image
        run: docker build -t flutter-agent-os-dev templates/devcontainer

      # The image must run the real local gate on a real app, not just start.
      - name: Gate the eval base app inside the container
        run: |
          bash evals/run.sh materialize base "$RUNNER_TEMP/base-app"
          docker run --rm -v "$RUNNER_TEMP/base-app":/work -w /work flutter-agent-os-dev \
            bash -c 'flutter --version && flutter pub get && flutter analyze --fatal-infos && flutter test'

  bootstrap:
    name: bootstrap round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap into a clean directory
        run: |
          mkdir -p /tmp/greenfield && cd /tmp/greenfield && git init -q
          bash "$GITHUB_WORKSPACE/templates/bootstrap.sh" --repo /tmp/greenfield

      - name: Required artifacts exist
        run: |
          cd /tmp/greenfield
          fail=0
          for p in .work.flutter .work.flutter/context/HANDOFF_FLUTTER.md \
                   .work.flutter/plans/NEXT_FLUTTER.md .work.flutter/STACK.md \
                   .cursorrules analysis_options.yaml DOCS_FLUTTER_STACK.md; do
            [ -e "$p" ] || { echo "missing: $p"; fail=1; }
          done
          exit $fail

      - name: Idempotent — second run must not clobber
        run: |
          cd /tmp/greenfield
          printf '\n# sentinel\n' >> .cursorrules
          bash "$GITHUB_WORKSPACE/templates/bootstrap.sh" --repo "$PWD"
          grep -q '# sentinel' .cursorrules || { echo "bootstrap clobbered existing content"; exit 1; }

      - name: Brownfield — existing files preserved
        run: |
          mkdir -p /tmp/brownfield/lib && cd /tmp/brownfield && git init -q
          echo "# mine" > analysis_options.yaml
          echo "# mine" > .cursorrules
          bash "$GITHUB_WORKSPACE/templates/bootstrap.sh" --repo "$PWD"
          head -1 analysis_options.yaml | grep -q '# mine' || { echo "clobbered analysis_options.yaml"; exit 1; }
          head -1 .cursorrules | grep -q '# mine' || { echo "clobbered .cursorrules"; exit 1; }

  deploy:
    name: install modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: basic
        run: |
          mkdir -p /tmp/t1 && cd /tmp/t1 && git init -q
          bash "$GITHUB_WORKSPACE/scripts/deploy-basic.sh" --target /tmp/t1
          test -f /tmp/t1/FLUTTER_AGENT_OS.md
          grep -q 'FLUTTER_AGENT_OS_BEGIN' /tmp/t1/.cursorrules

      - name: basic is not silently repeatable
        run: |
          set +e
          bash "$GITHUB_WORKSPACE/scripts/deploy-basic.sh" --target /tmp/t1
          [ $? -eq 2 ] || { echo "expected exit 2 on reinstall"; exit 1; }

      - name: files
        run: |
          mkdir -p /tmp/t2 && cd /tmp/t2 && git init -q
          bash "$GITHUB_WORKSPACE/scripts/deploy-files.sh" --target /tmp/t2
          bash /tmp/t2/.ai.flutter/scripts/framework-verify.sh --root /tmp/t2/.ai.flutter
